{% extends "base.html" %}

{% block title %}Appointment Calendar{% endblock %}

{% block extra_css %}
<link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet' />
<style>
    #calendar {
        max-width: 1100px;
        margin: 0 auto;
    }
    .fc-event {
        cursor: pointer;
    }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-calendar me-2"></i>Appointment Calendar</h2>
        <a href="{{ url_for('appointments.manage_availability') }}" class="btn btn-outline-primary">
            <i class="fas fa-cog me-2"></i>Manage Availability
        </a>
    </div>
    
    <div class="card shadow">
        <div class="card-body">
            <div id="calendar"></div>
        </div>
    </div>
</div>

<!-- Appointment Details Modal -->
<div class="modal fade" id="appointmentModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Appointment Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="appointmentDetails">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-success" id="completeBtn">Mark Complete</button>
                <button type="button" class="btn btn-danger" id="cancelBtn">Cancel</button>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js'></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');
    var currentAppointmentId = null;
    
    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'timeGridWeek',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        slotMinTime: '08:00:00',
        slotMaxTime: '20:00:00',
        events: '{{ url_for("appointments.doctor_appointments_data") }}',
        eventClick: function(info) {
            currentAppointmentId = info.event.id;
            var props = info.event.extendedProps;
            
            document.getElementById('appointmentDetails').innerHTML = `
                <p><strong>Patient:</strong> ${info.event.title}</p>
                <p><strong>Date:</strong> ${info.event.start.toLocaleDateString()}</p>
                <p><strong>Time:</strong> ${info.event.start.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</p>
                <p><strong>Reason:</strong> ${props.reason || 'Not specified'}</p>
            `;
            
            new bootstrap.Modal(document.getElementById('appointmentModal')).show();
        }
    });
    
    calendar.render();
    
    document.getElementById('completeBtn').addEventListener('click', function() {
        if (currentAppointmentId) {
            var form = document.createElement('form');
            form.method = 'POST';
            form.action = `/appointments/doctor/complete/${currentAppointmentId}`;
            document.body.appendChild(form);
            form.submit();
        }
    });
    
    document.getElementById('cancelBtn').addEventListener('click', function() {
        if (currentAppointmentId && confirm('Are you sure you want to cancel this appointment?')) {
            var form = document.createElement('form');
            form.method = 'POST';
            form.action = `/appointments/cancel/${currentAppointmentId}`;
            document.body.appendChild(form);
            form.submit();
        }
    });
});
</script>
{% endblock %}
