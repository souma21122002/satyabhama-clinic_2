{% extends "base.html" %}

{% block title %}Appointment Calendar{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-calendar me-2"></i>Appointment Calendar</h2>
        <a href="{{ url_for('doctor_appointments') }}" class="btn btn-outline-primary">
            <i class="fas fa-list me-2"></i>List View
        </a>
    </div>
    
    <div class="card shadow">
        <div class="card-body">
            <div id="calendar"></div>
        </div>
    </div>
</div>

<link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet' />
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js'></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
        initialView: 'timeGridWeek',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        slotMinTime: '08:00:00',
        slotMaxTime: '20:00:00',
        events: '/api/doctor/appointments',
        eventClick: function(info) {
            alert('Patient: ' + info.event.title + '\nReason: ' + (info.event.extendedProps.reason || 'Not specified'));
        }
    });
    calendar.render();
});
</script>
{% endblock %}
