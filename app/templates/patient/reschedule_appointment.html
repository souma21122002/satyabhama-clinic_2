{% extends "base.html" %}

{% block title %}Reschedule Appointment{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-warning">
                    <h4 class="mb-0"><i class="fas fa-calendar-alt me-2"></i>Reschedule Appointment</h4>
                </div>
                <div class="card-body">
                    <div class="alert alert-info">
                        <strong>Current:</strong> {{ appointment.appointment_date }} at {{ appointment.appointment_time }}
                    </div>
                    
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">New Date</label>
                            <input type="date" class="form-control" id="appointment_date" name="appointment_date" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">New Time</label>
                            <select class="form-select" id="appointment_time" name="appointment_time" required disabled>
                                <option value="">-- Select date first --</option>
                            </select>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <a href="{{ url_for('patient_appointments') }}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Reschedule</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const doctorId = {{ appointment.doctor_id }};
const dateInput = document.getElementById('appointment_date');
const timeSelect = document.getElementById('appointment_time');

dateInput.min = new Date().toISOString().split('T')[0];

dateInput.addEventListener('change', function() {
    const selectedDate = this.value;
    timeSelect.innerHTML = '<option value="">Loading slots...</option>';
    timeSelect.disabled = true;

    if (!selectedDate) {
        timeSelect.innerHTML = '<option value="">-- Select date first --</option>';
        return;
    }

    fetch(`/api/available-slots/${doctorId}/${selectedDate}`)
        .then(response => response.json())
        .then(data => {
            const hasSlots = data && Array.isArray(data.slots) && data.slots.length > 0;
            timeSelect.innerHTML = '<option value="">-- Select time --</option>';

            if (!data || data.available === false) {
                const message = data && data.message ? data.message : 'Doctor not available on this date.';
                timeSelect.innerHTML = `<option value="">${message}</option>`;
                return;
            }

            if (!hasSlots) {
                const message = data && data.message ? data.message : 'All slots are booked for this date.';
                timeSelect.innerHTML = `<option value="">${message}</option>`;
                return;
            }

            data.slots.forEach(slot => {
                const value = slot.time || slot;
                const label = slot.display || slot.time || slot;
                const remaining = typeof slot.remaining === 'number' ? ` (${slot.remaining} left)` : '';
                timeSelect.innerHTML += `<option value="${value}">${label}${remaining}</option>`;
            });

            timeSelect.disabled = false;
        })
        .catch(() => {
            timeSelect.innerHTML = '<option value="">Unable to load time slots. Please try again.</option>';
        });
});
</script>
{% endblock %}
